services:
  tomcat:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks:
      - ecommerce-net

  db:
    image: mysql:8
    container_name: mysql-pharmatex
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Pharmatex.sql:/docker-entrypoint-initdb.d/Pharmatex.sql
    networks:
      - ecommerce-net

networks:
  ecommerce-net:

volumes:
  db_data:
