services:
  tomcat:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=Pharmatex
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Password
    networks:
      - ecommerce-net

  db:
    image: mysql:8
    container_name: mysql-pharmatex
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Password
      MYSQL_DATABASE: Pharmatex
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Pharmatex.sql:/docker-entrypoint-initdb.d/Pharmatex.sql
    networks:
      - ecommerce-net

networks:
  ecommerce-net:

volumes:
  db_data:
