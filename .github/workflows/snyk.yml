name: Snyk Security Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------- JOB 1: Snyk SCA (dipendenze Maven) ----------
  snyk-sca:
    name: Snyk SCA (pom.xml)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Snyk - Analisi dipendenze Maven
        uses: snyk/actions/maven@11b673cfb4b0dc0d860a1323caa199d54950dcce  # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-sca.sarif

      - name: Carica risultati SARIF su GitHub Security
        if: always() && hashFiles('snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

  # ---------- JOB 2: Snyk Code (SAST) ----------
  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce  # master

      - name: Snyk - Analisi statica del codice
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}

      - name: Carica risultati SARIF su GitHub Security
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  # ---------- JOB 3: Snyk Container (immagine Docker) ----------
  snyk-container:
    name: Snyk Container (Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build immagine Docker
        run: docker build -t pharmatex:scan .

      - name: Snyk - Analisi container Docker
        uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce  # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_API_KEY }}
        with:
          image: pharmatex:scan
          args: --file=Dockerfile --severity-threshold=high --sarif-file-output=snyk-container.sarif

      - name: Carica risultati SARIF su GitHub Security
        if: always() && hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container