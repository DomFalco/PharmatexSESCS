name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- JOB 1: GitGuardian scanning ----------
  secrets:
    name: GitGuardian
    uses: ./.github/workflows/gitguardian.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  # ---------- JOB 2: Test suite ----------
  test:
    name: Test Suite
    needs: secrets
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read

  # ---------- JOB 3: SAST (SonarCloud) ----------
  sast:
    name: SAST (SonarCloud)
    needs: test
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      security-events: write

  # ---------- JOB 4: SCA (Snyk) ----------
  sca:
    name: SCA (Snyk)
    needs: test
    uses: ./.github/workflows/snyk.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  # ---------- JOB 5: Docker Build & Push ----------
  docker-publish:
    name: Docker Build & Push
    needs: [sast, sca]
    if: |
      github.event_name != 'pull_request' && 
      (github.ref == 'refs/heads/master' || 
       github.ref == 'refs/heads/main' || 
       startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
    permissions:
      contents: read